<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <style>
        body { text-align: center; margin-top: 100px; }
        .form-item { margin: 10px 0; }
        input { padding: 5px; width: 200px; }
        button { padding: 5px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>日程管理系统 - 登录</h1>
    <form action="user/login" method="post" onsubmit="return checkForm()">
        <div class="form-item">用户名：<input type="text" name="username" id="username" required></div>
        <div class="form-item">密码：<input type="password" name="password" id="password" required></div>
        <div class="form-item">
            <button type="submit">登录</button>
            <button type="reset">重置</button>
        </div>
    </form>
    <div>还没有账号？<a href="register.html">立即注册</a></div>
    <script>
        function checkForm() {
            let username = document.getElementById("username").value;
            let pwd = document.getElementById("password").value;
            if (username === "" || pwd === "") { alert("用户名和密码不能为空！"); return false; }
            return true;
        }
    </script>
</body>
</html>
